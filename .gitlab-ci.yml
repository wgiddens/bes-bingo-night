image: node:20

stages:
  - deploy

pages:
  stage: deploy
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run build
    # GitLab Pages expects a 'public' folder for artifacts
    - cp -r dist public
    # SPA fallback so deep links work on Pages
    - cp public/index.html public/404.html
  artifacts:
    paths:
      - public
  rules:
    # Publish only from the default branch (e.g., 'main')
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
